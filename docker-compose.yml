services:
  logvault:
    build: .
    image: logvault:latest
    container_name: logvault
    restart: unless-stopped
    ports:
      # Frontend calls http://127.0.0.1:8000, so keep the host port at 8000
      - "${LOGVAULT_PORT:-8000}:8000"
    environment:
      # Default: Ollama running on the Docker host. Use http://ollama:11434 with the "ollama" profile.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      BATCH_AI_LINES: ${BATCH_AI_LINES:-0}
      AUTO_INVESTIGATE: ${AUTO_INVESTIGATE:-true}
      INVESTIGATE_INTERVAL: ${INVESTIGATE_INTERVAL:-5}
      STORAGE_LIMIT_GB: ${STORAGE_LIMIT_GB:-0}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      # Security: sign-in, evaluation accounts, one-click demo, HTTPS (self-signed cert in the data volume)
      LOGVAULT_AUTH: ${LOGVAULT_AUTH:-true}
      LOGVAULT_SEED_OPERATORS: ${LOGVAULT_SEED_OPERATORS:-true}
      LOGVAULT_DEMO_LOGIN: ${LOGVAULT_DEMO_LOGIN:-true}
      LOGVAULT_TLS: ${LOGVAULT_TLS:-false}
      # Optional OpenSearch index: start with --profile opensearch and set OPENSEARCH_URL=http://opensearch:9200
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - logvault-data:/app/data

  # Optional local LLM (air-gapped: pre-load the image and models before deployment).
  # Start with: docker compose --profile ollama up -d  (and set OLLAMA_HOST=http://ollama:11434)
  ollama:
    image: ollama/ollama:latest
    container_name: logvault-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  # Optional full-text index (air-gapped: pre-load the image). Start with: docker compose --profile opensearch up -d
  # and set OPENSEARCH_URL=http://opensearch:9200 for the logvault service.
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: logvault-opensearch
    profiles: ["opensearch"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Reachable only inside the compose network (no published port); enable the security plugin
      # and set OPENSEARCH_USER / OPENSEARCH_PASSWORD when OpenSearch runs on a shared network.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  logvault-data:
  ollama-models:
  opensearch-data:
